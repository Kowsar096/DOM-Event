<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Event</title>
</head>
<body>
    <h1>Dom event</h1>

    <!-- Option 1 for event handler -->
    <button onclick="console.log(7)">Click me</button>
    <button onclick="console.log(68)">Click me</button>
    <button onclick="console.log('Clicked')">Click check</button>

    <br>
    <!-- option 2 for event handler -->

    <button onclick="makeYellow()">Make Yellow</button>
    <button onclick="makeRed()">Make Red</button>
    <button id="btn-make-blue">Make Blue</button>
    <button id="btn-make-green">Make Green</button>
    

    <script src="js/event.js"></script>
</body>
</html>
